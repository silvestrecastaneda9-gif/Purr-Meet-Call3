<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MeowMeet 🐾</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <header><h1>🐾 MeowMeet 🐾</h1></header>

  <div id="lobby-screen" class="card">
    <h2>Join or Start a Meow-ting</h2>
    <button onclick="createRoomCode()">✨ Create New Room Code</button>
    <div class="divider">OR</div>
    <div class="join-box">
      <input type="text" id="codeInput" placeholder="Enter 4-Digit Code" maxlength="4" />
      <button onclick="joinWithCode()">🐾 Join Room</button>
    </div>
  </div>

  <div id="call-screen" style="display: none;">
    <div class="room-info">
      <h3>Room Code: <span id="displayCode">----</span></h3>
      <button onclick="leaveRoom()">🚪 Leave Call</button>
    </div>
    <div id="video-grid">
      <div class="video-card">
        <video id="localVideo" autoplay muted playsinline></video>
        <div class="cat-ears"></div>
        <span class="label">You (Purr-senter)</span>
      </div>
    </div>
    <div class="controls">
      <button id="micBtn" onclick="toggleAudio()">🎤 Mute Mic</button>
      <button id="camBtn" onclick="toggleVideo()">📹 Camera Off</button>
      <button id="meowBtn" onclick="playMeow()">🐱 Meow!</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
